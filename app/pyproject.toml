[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brady-bot"
version = "0.1.0"
description = "Brady Bot — fantasy football platform (Lineup Picker, True Depth Chart)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0",
  "nflreadpy>=0.1",
  "pydantic>=2",
  "pyyaml>=6",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "rich>=13",
  "python-dotenv>=1.0",
  "itsdangerous>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx"]

[project.scripts]
brady-bot = "brady_bot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["brady_bot"]
omit = ["*/cli.py"]
