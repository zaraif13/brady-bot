location /brady-bot/ {
    alias /var/www/brady-bot/app/;
    try_files $uri $uri/ /brady-bot/index.html;
}

# Clean section routes served by uvicorn locally; redirect to the static page here.
location = /brady-bot/true-depth {
    return 302 /brady-bot/true-depth.html;
}

location = /brady-bot/opportunity-share {
    return 302 /brady-bot/opportunity-share.html;
}

location /brady-bot/api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /brady-bot/assets/ {
    alias /var/www/brady-bot/app/assets/;
}

location /brady-bot/js/ {
    alias /var/www/brady-bot/app/js/;
}
